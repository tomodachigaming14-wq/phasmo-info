<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phasmophobia Ghost Database & Maps</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0c0e;
            color: #e0e0e0;
            line-height: 1.6;
            padding: 20px;
        }

        /* Header & Search */
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #2a2e33;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #b0b8c0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 15px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            background: #14171a;
            border: 1px solid #2a2e33;
            color: #fff;
            border-radius: 30px;
            outline: none;
            transition: border 0.3s;
        }

        #searchInput:focus {
            border-color: #5a6b7a;
        }

        #searchInput::placeholder {
            color: #55606a;
        }

        /* Filter Buttons */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #111417;
            color: #8899a6;
            border: 1px solid #22272b;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #181c20;
            color: #b0b8c0;
        }

        .filter-btn.active {
            background: #1e2a32;
            color: #9bb7c9;
            border-color: #5a6b7a;
            box-shadow: 0 0 10px rgba(90, 107, 122, 0.2);
        }

        /* Section Visibility */
        .section-hidden {
            display: none !important;
        }

        /* Ghost Grid */
        .ghost-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .ghost-card {
            background: #111417;
            border: 1px solid #22272b;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .ghost-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-color: #3a454d;
        }

        .card-header {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #181c20;
            border-bottom: 1px solid #22272b;
        }

        .ghost-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: #0a0c0e;
            border-radius: 8px;
            margin-right: 15px;
            border: 1px solid #2a2e33;
        }

        .ghost-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-section {
            background: #0d0f11;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #333;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #6b7a85;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .info-text {
            font-size: 0.9rem;
            color: #c0c8cf;
        }

        .evidence-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 5px;
        }

        .evidence-tag {
            background: #1e2a32;
            color: #9bb7c9;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid #2e3f4a;
        }

        .pros-cons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }

        .pros { border-left: 2px solid #2e6b3e; }
        .cons { border-left: 2px solid #6b2e2e; }

        .pros .info-label { color: #4a9e6b; }
        .cons .info-label { color: #c45a5a; }

        /* Equipment Section */
        .equipment-section {
            max-width: 1400px;
            margin: 60px auto 20px;
            border-top: 2px solid #22272b;
            padding-top: 40px;
        }

        .equipment-section h2 {
            text-align: center;
            font-size: 2rem;
            color: #b0b8c0;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .equipment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .equip-card {
            background: #111417;
            border: 1px solid #22272b;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: background 0.2s;
        }

        .equip-card:hover {
            background: #181c20;
        }

        .equip-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.1));
        }

        .equip-name {
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
        }

        .equip-purpose {
            font-size: 0.85rem;
            color: #8899a6;
        }

        /* Cursed Possessions Section */
        .cursed-section {
            max-width: 1400px;
            margin: 60px auto 20px;
            border-top: 2px solid #22272b;
            padding-top: 40px;
        }

        .cursed-section h2 {
            text-align: center;
            font-size: 2rem;
            color: #b0b8c0;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .cursed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .cursed-card {
            background: #111417;
            border: 1px solid #2a1e22;
            border-left: 3px solid #6b2e2e;
            border-radius: 8px;
            padding: 15px;
            transition: background 0.2s;
        }

        .cursed-card:hover {
            background: #181c20;
            border-left-color: #c45a5a;
        }

        .cursed-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 5px rgba(180, 80, 80, 0.2));
        }

        .cursed-name {
            font-weight: 600;
            color: #e0a0a0;
            margin-bottom: 6px;
            font-size: 1.05rem;
        }

        .cursed-purpose {
            font-size: 0.85rem;
            color: #a0b0bc;
            margin-bottom: 6px;
        }

        .cursed-risk {
            font-size: 0.8rem;
            color: #c45a5a;
            border-top: 1px solid #2a1e22;
            padding-top: 6px;
            margin-top: 6px;
        }

        /* Maps Section (List Layout) */
        .maps-section {
            max-width: 800px;
            margin: 60px auto 20px;
            border-top: 2px solid #22272b;
            padding-top: 40px;
        }

        .maps-section h2 {
            text-align: center;
            font-size: 2rem;
            color: #b0b8c0;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .map-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Custom Scrollbar for map list */
        .map-list::-webkit-scrollbar {
            width: 8px;
        }
        .map-list::-webkit-scrollbar-track {
            background: #111417;
            border-radius: 4px;
        }
        .map-list::-webkit-scrollbar-thumb {
            background: #3a454d;
            border-radius: 4px;
        }
        .map-list::-webkit-scrollbar-thumb:hover {
            background: #5a6b7a;
        }

        .map-list-item {
            background: #111417;
            border: 1px solid #22272b;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }

        .map-list-item:hover {
            background: #181c20;
            border-color: #3a454d;
        }

        .map-list-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e0e0e0;
            letter-spacing: 1px;
        }

        .map-thumbnail {
            width: 80px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #3a454d;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .map-thumbnail:hover {
            transform: scale(1.1);
            border-color: #b0b8c0;
        }

        /* --- MODAL LIGHTBOX --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.95); 
            overflow: hidden;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-header {
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111417;
            border-bottom: 1px solid #333;
            z-index: 10;
        }

        .modal-title {
            color: #b0b8c0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .modal-controls {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            background: #22272b;
            color: #fff;
            border: 1px solid #3a454d;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s, color 0.2s;
        }

        .modal-btn:hover {
            background: #3a454d;
        }

        .close-btn {
            background: #6b2e2e;
            border-color: #c45a5a;
        }

        .close-btn:hover {
            background: #c45a5a;
        }

        .modal-body {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto; 
            padding: 20px;
            position: relative;
        }

        #modalImage {
            max-width: 100%;
            max-height: 100%;
            transition: transform 0.2s ease-out;
            transform-origin: center center;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .ghost-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
            .modal-header { flex-direction: column; gap: 10px; }
            .map-list-item { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>

        // ---------------------------------------------------------------

        const equipment = [

        // ---------------------------------------------------------------
        // CURSED POSSESSIONS DATA
        // ---------------------------------------------------------------
        const cursedItems = [
            {

            {

            },
            {
                name: "Music Box",
                img: "images/musicbox.png",

            },
            {

            },
            {

                img: "images/tarot.png",

            {
                name: "Monkey Paw",
                img: "images/monkeypaw.png",
                purpose: "Make wishes like 'I wish to be sane,' 'I wish to see the ghost,' 'I wish to trap the ghost,' or 'I wish to leave.' Number of wishes depends on difficulty (3–5).",
                risk: "Every wish has a penalty. 'I wish for life' has a 50% chance of killing you. 'I wish for knowledge' teleports the ghost to you and starts a hunt. 'I wish to see the ghost' locks doors and hunts after 5 seconds."
            }
        ];

        // ---------------------------------------------------------------
        // MAP DATA
        // ---------------------------------------------------------------
        const maps = [
            { name: "Map 1 (Tanglewood Drive)", img: "images/map/map1.jpg" },
            { name: "Map 2 (42 Edgefield Road)", img: "images/map/map2.jpg" },
            { name: "Map 3 (10 Ridgeview Court)", img: "images/map/map3.jpg" },
            { name: "Map 4 (Nell's Diner)", img: "images/map/map4.jpg" },
            { name: "Map 5 (Grafton Farmhouse)", img: "images/map/map5.jpg" },
            { name: "Map 6 (13 Willow Street)", img: "images/map/map6.jpg" },
            { name: "Map 7 (Point Hope - Small)", img: "images/map/map7.jpg" },
            { name: "Map 8 (Prison)", img: "images/map/map8.jpg" },
            { name: "Map 9 (Camp Woodwind)", img: "images/map/map9.jpg" },
            { name: "Map 10 (Point Hope - Medium)", img: "images/map/map10.jpg" },
            { name: "Map 11-1 Left (Brownstone HS)", img: "images/map/map11-1-left.jpg" },
            { name: "Map 11-1 Right (Brownstone HS)", img: "images/map/map11-1-right.jpg" },
            { name: "Map 11-2 Right (Brownstone HS)", img: "images/map/map11-2-right.jpg" },
            { name: "Map 12 (Bleasdale Farmhouse)", img: "images/map/map12.jpg" },
            { name: "Map 13-1 (Sunny Meadows - Restricted)", img: "images/map/map13-1.jpg" },
            { name: "Map 13-2 (Sunny Meadows - Male Wing)", img: "images/map/map13-2.jpg" },
            { name: "Map 13-3 (Sunny Meadows - Female Wing)", img: "images/map/map13-3.jpg" },
            { name: "Map 13-4 (Sunny Meadows - Basement)", img: "images/map/map13-4.jpg" },
            { name: "Map 13-5 (Sunny Meadows - Hospital)", img: "images/map/map13-5.jpg" },
            { name: "Map 14 (Prison - Full)", img: "images/map/map14.jpg" },
            { name: "Map 15 (Maple Lodge Campsite)", img: "images/map/map15.jpg" },
            { name: "Map 16 (Brownstone HS - Full)", img: "images/map/map16.jpg" },
            { name: "Map 17 (Sunny Meadows - Full)", img: "images/map/map17.jpg" }
        ];

        // ---------------------------------------------------------------
        // RENDERING & FILTER LOGIC
        // ---------------------------------------------------------------

        const ghostGrid = document.getElementById('ghostGrid');
        const equipGrid = document.getElementById('equipGrid');
        const cursedGrid = document.getElementById('cursedGrid');
        const mapList = document.getElementById('mapList');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let currentFilter = 'all';
        let searchQuery = '';

        // Render Ghost Cards
        function renderGhosts() {
            ghostGrid.innerHTML = ghosts.map(ghost => `
                <div class="ghost-card" data-search="${(ghost.name + ' ' + ghost.evidence.join(' ') + ' ' + ghost.description).toLowerCase()}">
                    <div class="card-header">
                        <img src="${ghost.img}" alt="${ghost.name}" class="ghost-img" onerror="this.style.display='none'">
                        <span class="ghost-name">${ghost.name}</span>
                    </div>
                    <div class="card-body">
                        <div class="info-section">
                            <div class="info-label">Description</div>
                            <div class="info-text">${ghost.description}</div>
                        </div>
                        
                        <div class="info-section">
                            <div class="info-label">Evidence</div>
                            <div class="evidence-tags">
                                ${ghost.evidence.map(ev => `<span class="evidence-tag">${ev}</span>`).join('')}
                            </div>
                        </div>

                        <div class="pros-cons">
                            <div class="info-section pros">
                                <div class="info-label">Pros / Traits</div>
                                <div class="info-text" style="font-size:0.8rem">${ghost.pros.join('<br>')}</div>
                            </div>
                            <div class="info-section cons">
                                <div class="info-label">Cons / Weakness</div>
                                <div class="info-text" style="font-size:0.8rem">${ghost.cons.join('<br>')}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Render Equipment Cards
        function renderEquipment() {
            equipGrid.innerHTML = equipment.map(item => `
                <div class="equip-card" data-search="${(item.name + ' ' + item.purpose).toLowerCase()}">
                    <img src="${item.img}" alt="${item.name}" class="equip-img" onerror="this.style.display='none'">
                    <div class="equip-name">${item.name}</div>
                    <div class="equip-purpose">${item.purpose}</div>
                </div>
            `).join('');
        }

        // Render Cursed Possessions Cards
        function renderCursed() {
            cursedGrid.innerHTML = cursedItems.map(item => `
                <div class="cursed-card" data-search="${(item.name + ' ' + item.purpose + ' ' + item.risk).toLowerCase()}">
                    <img src="${item.img}" alt="${item.name}" class="cursed-img" onerror="this.style.display='none'">
                    <div class="cursed-name">${item.name}</div>
                    <div class="cursed-purpose">${item.purpose}</div>
                    <div class="cursed-risk">⚠ ${item.risk}</div>
                </div>
            `).join('');
        }

        // Render Maps List
        function renderMaps() {
            mapList.innerHTML = maps.map(map => `
                <div class="map-list-item" data-search="${map.name.toLowerCase()}">
                    <div class="map-list-name">${map.name}</div>
                    <img src="${map.img}" alt="${map.name} Thumbnail" class="map-thumbnail" data-img="${map.img}" data-title="${map.name}" onerror="this.style.display='none'">
                </div>
            `).join('');
        }

        // Initial Render
        renderGhosts();
        renderEquipment();
        renderCursed();
        renderMaps();

        // ---------------------------------------------------------------
        // FILTER & SEARCH ENGINE
        // ---------------------------------------------------------------
        function applyFilters() {
            searchQuery = searchInput.value.toLowerCase().trim();
            
            // 1. Toggle Section Visibility based on active button
            document.getElementById('ghost-section').classList.toggle('section-hidden', currentFilter !== 'all' && currentFilter !== 'ghosts');
            document.getElementById('equipment-section').classList.toggle('section-hidden', currentFilter !== 'all' && currentFilter !== 'equipment');
            document.getElementById('cursed-section').classList.toggle('section-hidden', currentFilter !== 'all' && currentFilter !== 'cursed');
            document.getElementById('maps-section').classList.toggle('section-hidden', currentFilter !== 'all' && currentFilter !== 'maps');

            // 2. Filter individual cards inside the visible sections
            const allCards = document.querySelectorAll('.ghost-card, .equip-card, .cursed-card, .map-list-item');
            
            allCards.forEach(card => {
                const searchString = card.getAttribute('data-search') || '';
                if (searchString.includes(searchQuery)) {
                    card.style.display = ''; // Show
                } else {
                    card.style.display = 'none'; // Hide
                }
            });
        }

        // Search Input Listener
        searchInput.addEventListener('input', applyFilters);

        // Filter Button Listener
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove active class from all
                filterBtns.forEach(b => b.classList.remove('active'));
                // Add to clicked
                e.target.classList.add('active');
                // Set current filter
                currentFilter = e.target.getAttribute('data-filter');
                // Apply
                applyFilters();
            });
        });

        // ---------------------------------------------------------------
        // MODAL LOGIC
        // ---------------------------------------------------------------
        const modal = document.getElementById('mapModal');
        const modalImg = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        let currentZoom = 1;

        // Use Event Delegation so we don't break on apostrophes in names
        document.getElementById('mapList').addEventListener('click', (e) => {
            if (e.target.classList.contains('map-thumbnail')) {
                const imgSrc = e.target.getAttribute('data-img');
                const title = e.target.getAttribute('data-title');
                openModal(imgSrc, title);
            }
        });

        function openModal(imgSrc, title) {
            modalImg.src = imgSrc;
            modalTitle.textContent = title;
            currentZoom = 1;
            modalImg.style.transform = `scale(${currentZoom})`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto'; // Restore scrolling
        }

        function zoomImage(factor) {
            currentZoom += factor;
            if (currentZoom < 1) currentZoom = 1; // Don't zoom out smaller than original size
            if (currentZoom > 4) currentZoom = 4; // Cap zoom at 4x
            modalImg.style.transform = `scale(${currentZoom})`;
        }

        function resetZoom() {
            currentZoom = 1;
            modalImg.style.transform = `scale(${currentZoom})`;
        }

        // Close modal when clicking outside the image area
        modal.addEventListener('click', (e) => {
            if (e.target === modal || e.target.classList.contains('modal-body')) {
                closeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });
    </script>
